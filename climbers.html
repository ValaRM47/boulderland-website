<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لیست شرکت‌کنندگان | بلدرلند کاپ</title>
<meta name="description" content="فهرست شرکت‌کنندگان و گروه‌بندی مسابقات بلدرلند کاپ." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;500;600;700;800;900&family=Anton&display=swap" rel="stylesheet" />
<style>
:root{
  --sand:#e7ad72; --forest:#3c4b48; --moss:#3f6356; --cream:#e2c2a1;
  --ink:#1b2321; --white:#fdfbf7; --radius:18px; --ease:cubic-bezier(.22,1,.36,1); --maxw:1100px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--ink);color:var(--cream);line-height:1.7;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
::selection{background:var(--sand);color:var(--forest)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(20px,5vw,48px)}

/* header */
.top{padding:clamp(70px,10vw,110px) 0 clamp(24px,4vw,40px)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--sand);letter-spacing:2px;margin-bottom:18px;border:1px solid rgba(231,173,114,.4);padding:8px 18px;border-radius:99px}
.top h1{font-size:clamp(32px,5.5vw,60px);font-weight:900;color:var(--white);letter-spacing:-1px;margin-bottom:14px}
.top p{color:rgba(246,237,225,.7);font-size:16px;font-weight:300;max-width:560px}

/* toolbar */
.toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:26px 0 6px}
.search{position:relative;flex:1;min-width:240px;max-width:420px}
.search input{width:100%;background:var(--forest);border:1.5px solid rgba(231,173,114,.22);border-radius:14px;padding:14px 46px 14px 16px;color:var(--white);font-family:inherit;font-size:16px;outline:none;transition:border-color .25s}
.search input::placeholder{color:rgba(246,237,225,.45)}
.search input:focus{border-color:var(--sand)}
.search svg{position:absolute;top:50%;inset-inline-end:16px;transform:translateY(-50%);width:20px;height:20px;stroke:var(--sand);fill:none;stroke-width:2;pointer-events:none}
.meta{font-size:13px;color:rgba(246,237,225,.55);display:flex;align-items:center;gap:8px}
.meta .dot{width:8px;height:8px;border-radius:50%;background:var(--sand)}

/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:20px 0 clamp(70px,10vw,120px)}
.grp{background:var(--forest);border:1px solid rgba(231,173,114,.16);border-radius:var(--radius);overflow:hidden;transition:border-color .25s}
.grp:hover{border-color:rgba(231,173,114,.4)}
.grp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;background:rgba(231,173,114,.08);border-bottom:1px solid rgba(231,173,114,.16)}
.grp-head h3{font-size:19px;font-weight:800;color:var(--white)}
.grp-count{font-size:13px;font-weight:800;color:var(--forest);background:var(--sand);padding:4px 12px;border-radius:99px}
.grp-list{list-style:none}
.climber{display:flex;align-items:center;gap:14px;padding:13px 22px;border-bottom:1px solid rgba(231,173,114,.09)}
.climber:last-child{border-bottom:none}
.climber .idx{width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;border-radius:8px;background:rgba(231,173,114,.12);color:var(--sand);font-size:13px;font-weight:700}
.climber .cname{font-weight:600;color:var(--white);font-size:15.5px}
.climber .cextra{font-size:13px;color:rgba(246,237,225,.6);margin-inline-start:auto}
.climber.hide{display:none}
.grp.hide{display:none}

/* states */
.state{text-align:center;padding:70px 20px;color:rgba(246,237,225,.7)}
.state .spinner{width:44px;height:44px;border:3px solid rgba(231,173,114,.25);border-top-color:var(--sand);border-radius:50%;margin:0 auto 18px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state.err{color:#f0a48f}
.state a{color:var(--sand);text-decoration:underline}
.empty{padding:40px;text-align:center;color:rgba(246,237,225,.5);grid-column:1/-1}
</style>
</head>
<body>

<section class="top">
  <div class="wrap">
    <span class="eyebrow">بلدرلند کاپ</span>
    <h1>فهرست شرکت‌کنندگان</h1>
    <p>گروه‌بندی و ترتیب شرکت‌کنندگان مسابقه. برای پیدا کردن نام خود از جست‌وجو استفاده کنید.</p>

    <div class="toolbar">
      <label class="search">
        <input type="search" id="search" placeholder="جست‌وجوی نام…" aria-label="جست‌وجو" />
        <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </label>
      <span class="meta" id="meta"></span>
    </div>
  </div>
</section>

<div class="wrap">
  <div class="groups" id="groups">
    <div class="state" id="state"><div class="spinner"></div>در حال بارگذاری فهرست…</div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — paste your Google Sheet "Publish to web → CSV" link
   ============================================================ */
const SHEET_CSV_URL = "";          // e.g. https://docs.google.com/spreadsheets/d/e/XXXX/pub?gid=0&single=true&output=csv
const GROUP_BY      = "";          // column header to group by. "" = auto-detect (looks for گروه / group)
const REFRESH_MS    = 60000;       // re-fetch every 60s (Google republishes edits every few minutes)

const groupsEl=document.getElementById('groups');
const stateEl=document.getElementById('state');
const metaEl=document.getElementById('meta');
let lastData=null;

/* --- minimal CSV parser (handles quotes/commas/newlines) --- */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else { if(c==='"')q=true; else if(c===','){row.push(cur);cur=''}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
      else if(c!=='\r')cur+=c }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

function render(rows){
  if(!rows.length){groupsEl.innerHTML='<div class="empty">فهرستی برای نمایش وجود ندارد.</div>';return;}
  const headers=rows[0].map(h=>h.trim());
  const data=rows.slice(1);
  // find group column
  let gi = GROUP_BY ? headers.findIndex(h=>h===GROUP_BY) : headers.findIndex(h=>/گروه|group/i.test(h));
  const nameCols=headers.map((h,i)=>i).filter(i=>i!==gi);

  // build groups map (preserve first-seen order)
  const map=new Map();
  data.forEach(r=>{
    const key=(gi>=0 ? (r[gi]||'').trim() : 'همه') || 'بدون گروه';
    if(!map.has(key))map.set(key,[]);
    map.get(key).push(r);
  });

  let html='';let total=0;
  for(const [group,members] of map){
    total+=members.length;
    html+=`<div class="grp" data-group="${esc(group)}"><div class="grp-head"><h3>${esc(group)}</h3><span class="grp-count">${toFa(members.length)} نفر</span></div><ul class="grp-list">`;
    members.forEach((r,idx)=>{
      const name=esc((r[nameCols[0]]||'').trim());
      const extra=nameCols.slice(1).map(i=>(r[i]||'').trim()).filter(Boolean).join(' · ');
      html+=`<li class="climber" data-name="${name.toLowerCase()}"><span class="idx">${toFa(idx+1)}</span><span class="cname">${name}</span>${extra?`<span class="cextra">${esc(extra)}</span>`:''}</li>`;
    });
    html+='</ul></div>';
  }
  groupsEl.innerHTML=html;
  metaEl.innerHTML=`<span class="dot"></span> ${toFa(total)} شرکت‌کننده · به‌روزرسانی: ${new Date().toLocaleTimeString('fa-IR')}`;
  applyFilter();
}

const toFa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  if(!SHEET_CSV_URL){
    stateEl.className='state err';
    stateEl.innerHTML='لینک گوگل‌شیت تنظیم نشده است. مقدار <b>SHEET_CSV_URL</b> را در کد وارد کنید.';
    return;
  }
  try{
    const url=SHEET_CSV_URL+(SHEET_CSV_URL.includes('?')?'&':'?')+'_='+Date.now();
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error(res.status);
    const text=await res.text();
    const rows=parseCSV(text);
    lastData=rows;
    render(rows);
  }catch(e){
    if(!lastData){
      stateEl.className='state err';
      stateEl.innerHTML='بارگذاری فهرست ممکن نشد. مطمئن شوید گوگل‌شیت به‌صورت «Publish to web → CSV» منتشر شده است.';
    }
  }
}

/* search filter */
document.getElementById('search').addEventListener('input',applyFilter);
function applyFilter(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('.grp').forEach(grp=>{
    let visible=0;
    grp.querySelectorAll('.climber').forEach(c=>{
      const match=!q||c.dataset.name.includes(q);
      c.classList.toggle('hide',!match);
      if(match)visible++;
    });
    grp.classList.toggle('hide',visible===0);
  });
}

load();
setInterval(load,REFRESH_MS);
</script>
</body>
</html>
